name: CI

# Specialist matrix CI (BL-02 stage 1): one matrix job builds EACH of the five
# specialists (macOS metal; Linux cuda + vulkan; Windows cuda + vulkan) from the
# same sources with exactly one backend enabled. No machine/env-dependent build
# logic — every fact is a literal in this file. CUDA/Vulkan toolkits come from
# pinned public actions. Artifacts are named by (rid, specialist) so the NuGet
# pack job maps them into the runtimes/<rid>/native slices the managed resolver
# loads (metal .dylib / cuda+cuda .so|.dll / vulkan .so|.dll).
on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'NuGet package version to pack and publish'
        required: false
        default: '0.1.0'

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  # ── 5-specialist build matrix ──
  specialist-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: osx-arm64-metal
            os: macos-14
            backend: METAL
            rid: osx-arm64
            specialist: metal
            artifact: native-osx-arm64-metal
          - name: linux-x64-cuda
            os: ubuntu-22.04
            backend: CUDA
            rid: linux-x64
            specialist: cuda
            artifact: native-linux-x64-cuda
          - name: linux-x64-vulkan
            os: ubuntu-22.04
            backend: VULKAN
            rid: linux-x64
            specialist: vulkan
            artifact: native-linux-x64-vulkan
          - name: win-x64-cuda
            os: windows-2022
            backend: CUDA
            rid: win-x64
            specialist: cuda
            artifact: native-win-x64-cuda
          - name: win-x64-vulkan
            os: windows-2022
            backend: VULKAN
            rid: win-x64
            specialist: vulkan
            artifact: native-win-x64-vulkan
          - name: win-arm64-cpu
            os: windows-2022
            backend: CPU
            rid: win-arm64
            specialist: cpu
            artifact: native-win-arm64-cpu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA toolkit (cuda specialists)
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'

      - name: Install Vulkan SDK (vulkan specialists)
        if: matrix.backend == 'VULKAN'
        uses: lukka/get-cmake@latest
      - name: Install Vulkan SDK (Linux vulkan)
        if: matrix.backend == 'VULKAN' && matrix.os == 'ubuntu-22.04'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true
        # full SDK incl. glslc — apt's libvulkan-dev lacks the shader compiler,
        # which made ggml-vulkan's find_package(Vulkan) fail configure
      - name: Install Vulkan SDK (Windows vulkan)
        if: matrix.backend == 'VULKAN' && matrix.os == 'windows-2022'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Install build deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Configure + build specialist (${{ matrix.specialist }}, ${{ matrix.rid }})
        shell: bash
        run: |
          cmake -B build-${{ matrix.specialist }} \
            -DPVX_BACKEND_${{ matrix.backend }}=ON \
            -DPVX_BACKEND_CPU=OFF \
            -DCMAKE_BUILD_TYPE=Release
          if [ "${{ matrix.backend }}" = "CUDA" ]; then
            # nvcc OOM-kills on 7 GB shared runners with full parallelism — cap it
            cmake --build build-${{ matrix.specialist }} --config Release -j2
          else
            cmake --build build-${{ matrix.specialist }} --config Release -j
          fi

      - name: Locate specialist module
        shell: bash
        id: module
        run: |
          set -e
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            FILE="build-${{ matrix.specialist }}/Release/pvx-${{ matrix.specialist }}.dll"
            # cpu specialist on Windows builds under the generic payload name
            [ -f "$FILE" ] || FILE="build-${{ matrix.specialist }}/Release/pvxinference.dll"
          elif [ "${{ matrix.os }}" = "macos-14" ]; then
            FILE="build-${{ matrix.specialist }}/libpvx-metal.dylib"
            # metal specialist may build under the generic payload name
            [ -f "$FILE" ] || FILE="build-${{ matrix.specialist }}/libpvxinference.dylib"
          else
            FILE="build-${{ matrix.specialist }}/libpvx-${{ matrix.specialist }}.so"
          fi
          ls -l "$FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload specialist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.module.outputs.path }}
          if-no-files-found: error

  # ── C# binding build (managed layer compiles cross-platform, no native needed) ──
  csharp-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build managed layer (product + tests, no native resolution at build)
        run: |
          cd csharp
          dotnet build ProvostXInference.csproj -c Release
          dotnet build Tests/ProvostXInference.Tests.csproj -c Release

  # ── Windows lane (BL-45): MSVC native build + native tests (model-gated
  # legs typed-skip without models — same behavior as the VM verification run)
  # + the C# suite against the freshly-built x64 dll. ──
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure + build native (MSVC, Release)
        shell: bash
        run: |
          cmake -B build-win -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win --config Release -j

      - name: Run native tests (model-free; model-gated legs typed-skip)
        shell: bash
        run: ctest --test-dir build-win --build-config Release --output-on-failure

      - name: Stage native dll for the C# resolver (win-x64)
        shell: bash
        run: |
          mkdir -p csharp/runtimes/win-x64/native
          cp build-win/Release/pvxinference.dll csharp/runtimes/win-x64/native/

      - name: C# suite
        shell: bash
        run: |
          cd csharp
          dotnet test Tests/ProvostXInference.Tests.csproj -c Release --nologo

  # ── NuGet pack (NO publish) — maps every specialist into its runtimes slice ──
  nuget-pack:
    needs: specialist-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download all specialist artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-libs

      - name: Map specialists into runtimes slices
        run: |
          mkdir -p csharp/runtimes/osx-arm64/native
          mkdir -p csharp/runtimes/linux-x64/native
          mkdir -p csharp/runtimes/win-x64/native
          if [ -f native-libs/native-osx-arm64-metal/libpvx-metal.dylib ]; then
            cp native-libs/native-osx-arm64-metal/libpvx-metal.dylib  csharp/runtimes/osx-arm64/native/
          else
            # metal specialist built under the generic payload name
            cp native-libs/native-osx-arm64-metal/libpvxinference.dylib csharp/runtimes/osx-arm64/native/
          fi
          cp native-libs/native-linux-x64-cuda/libpvx-cuda.so        csharp/runtimes/linux-x64/native/
          cp native-libs/native-linux-x64-vulkan/libpvx-vulkan.so    csharp/runtimes/linux-x64/native/
          cp native-libs/native-win-x64-cuda/pvx-cuda.dll            csharp/runtimes/win-x64/native/
          cp native-libs/native-win-x64-vulkan/pvx-vulkan.dll        csharp/runtimes/win-x64/native/
          cp native-libs/native-win-arm64-cpu/pvxinference.dll       csharp/runtimes/win-arm64/native/

      - name: Pack NuGet
        run: |
          cd csharp
          dotnet pack ProvostXInference.csproj -c Release -o ../nupkg /p:Version=${{ github.event.inputs.package_version || '0.1.0' }}

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkg/*.nupkg

  # Trusted publishing (OIDC, NO stored API key) - explicit dispatch only.
  # Requires a matching Trusted Publisher policy on nuget.org:
  #   package owner = your nuget.org account, package ID = ProvostXInference,
  #   repository owner = ProvostX-Labs, repository name = ProvostXInference,
  #   workflow filename = ci.yml (must match EXACTLY), environment = empty.
  # Setup checklist: docs/trusted-publishing.md
  nuget-publish:
    needs: nuget-pack
    runs-on: ubuntu-22.04
    permissions:
      id-token: write   # OIDC token exchange - the ONLY permission needed
      contents: read
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download packed package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nupkg

      - name: NuGet login (OIDC -> short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org (trusted publish)
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.nugetApiKey }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate